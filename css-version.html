<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小橘猫 · 云养猫</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(180deg, #ffe8d6 0%, #ffd6ba 100%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .app {
    width:100%;
    max-width:420px;
    background:#fff9f0;
    border-radius:24px;
    box-shadow:0 10px 40px rgba(200,120,60,.25);
    overflow:hidden;
    padding:20px;
  }
  .title {
    text-align:center;
    font-size:22px;
    font-weight:800;
    color:#b4552e;
    margin-bottom:4px;
    letter-spacing:2px;
  }
  .subtitle {
    text-align:center;
    font-size:12px;
    color:#c98a6a;
    margin-bottom:16px;
  }

  /* ===== 小猫舞台 ===== */
  .stage {
    background: linear-gradient(180deg, #cdeffd 0%, #e8f9ff 60%, #b7e0b0 100%);
    border-radius:20px;
    height:260px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .sun { position:absolute; top:20px; right:28px; width:50px; height:50px; border-radius:50%;
    background:radial-gradient(circle, #ffe680, #ffd24d); box-shadow:0 0 30px #ffe680; }
  .cloud { position:absolute; top:24px; left:18px; width:70px; height:24px; background:#fff; border-radius:20px; opacity:.9; }
  .cloud::before { content:''; position:absolute; top:-12px; left:10px; width:34px; height:34px; background:#fff; border-radius:50%; }
  .cloud::after  { content:''; position:absolute; top:-6px; left:34px; width:26px; height:26px; background:#fff; border-radius:50%; }
  .grass { position:absolute; bottom:0; left:0; right:0; height:44px;
    background:linear-gradient(180deg,#8fd373,#6fc457); border-radius:0; }
  .grass::before { content:''; position:absolute; top:-8px; left:0; right:0; height:10px;
    background:#8fd373; border-radius:50% 50% 0 0; }

  /* ===== 小猫本体（CSS 绘制） ===== */
  .cat {
    position:absolute;
    bottom:32px;
    left:50%;
    transform:translateX(-50%);
    width:150px; height:150px;
    transition: transform .18s ease;
    cursor:pointer;
  }
  .cat.wiggle { animation: wiggle .4s ease; }
  .cat.bounce { animation: bounce .5s ease; }
  .cat.sleep { animation: breathe 2.6s ease-in-out infinite; }
  .cat.flash { animation: flash 1.2s ease; }
  @keyframes wiggle { 0%{transform:translateX(-50%) rotate(0)} 25%{transform:translateX(-45%) rotate(-4deg)} 75%{transform:translateX(-55%) rotate(4deg)} 100%{transform:translateX(-50%) rotate(0)} }
  @keyframes bounce { 0%{bottom:32px} 50%{bottom:60px} 100%{bottom:32px} }
  @keyframes breathe { 0%{transform:translateX(-50%) scale(1)} 50%{transform:translateX(-50%) scale(1.03)} 100%{transform:translateX(-50%) scale(1)} }
  @keyframes flash { 0%{filter:brightness(1)} 30%{filter:brightness(1.8)} 100%{filter:brightness(1)} }

  .cat-body { position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:110px; height:88px; background:#f6a84c; border-radius:48% 48% 42% 42%; }
  .cat-body.belly { box-shadow:inset 0 -20px 0 -8px #ffe3b3; }

  .cat-head { position:absolute; bottom:56px; left:50%; transform:translateX(-50%);
    width:96px; height:84px; background:#f6a84c; border-radius:50% 50% 46% 46%; z-index:2; }
  /* 耳朵 */
  .ear { position:absolute; top:-14px; width:0; height:0; }
  .ear.l { left:4px;  border-left:20px solid transparent; border-right:6px solid transparent; border-bottom:30px solid #f6a84c; transform:rotate(-18deg); }
  .ear.r { right:4px; border-right:20px solid transparent; border-left:6px solid transparent; border-bottom:30px solid #f6a84c; transform:rotate(18deg); }
  .ear-in.l { left:14px; top:-4px; border-left:12px solid transparent; border-right:4px solid transparent; border-bottom:18px solid #ffcd96; transform:rotate(-18deg); }
  .ear-in.r { right:14px; top:-4px; border-right:12px solid transparent; border-left:4px solid transparent; border-bottom:18px solid #ffcd96; transform:rotate(18deg); }

  /* 眼睛 + 表情（随状态切换） */
  .eye-wrap { position:absolute; top:30px; width:26px; height:26px; }
  .eye-wrap.l { left:16px; } .eye-wrap.r { right:16px; }
  .eye { position:absolute; inset:0; }
  .pupil { position:absolute; width:9px; height:11px; background:#3a2b20; border-radius:50%; bottom:2px; left:50%; transform:translateX(-50%); }
  .blink { width:26px; height:5px; background:#3a2b20; border-radius:4px; position:absolute; top:50%; left:0; display:none; }
  .happy .eye .pupil.y { top:14px; background:none; }
  .happy .eye .pupil.y::before{ content:''; position:absolute; width:6px; height:6px; border-right:3px solid #3a2b20; border-bottom:3px solid #3a2b20; transform:rotate(-45deg); }
  .sad .eye { height:16px; top:auto; bottom:4px; }
  .sad .pupil { width:8px; height:10px; bottom:0; }
  .sad .brow { position:absolute; top:-8px; left:-2px; width:30px; height:4px; background:#3a2b20; border-radius:3px; }
  .sad .brow.l { transform:rotate(20deg); } .sad .brow.r { transform:rotate(-20deg); }

  /* 嘴 */
  .nose { position:absolute; top:52px; left:50%; transform:translateX(-50%);
    width:12px; height:9px; background:#e5788a; border-radius:50% 50% 60% 60%; z-index:3; }
  .mouth { position:absolute; top:58px; left:50%; transform:translateX(-50%);
    width:24px; height:12px; border-bottom:3px solid #8a4b2e; border-radius:0 0 50% 50%; }
  .happy .mouth { border-bottom:none; border:3px solid #8a4b2e; border-top:none; height:14px; border-radius:0 0 50% 50%; }
  .tired .mouth { width:8px; height:8px; }
  .sleep .mouth { width:0; height:0; }

  /* 腮红 */
  .blush { position:absolute; top:48px; width:14px; height:9px; border-radius:50%; background:rgba(255,140,140,.55); }
  .blush.l { left:4px; } .blush.r { right:4px; }

  /* 胡须 */
  .whisker { position:absolute; top:46px; width:38px; height:2px; background:rgba(90,50,30,.5); }
  .whisker.l1 { left:-36px; transform:rotate(-8deg); } .whisker.l2 { left:-38px; top:56px; transform:rotate(6deg); }
  .whisker.r1 { right:-36px; transform:rotate(8deg); } .whisker.r2 { right:-38px; top:56px; transform:rotate(-6deg); }

  /* 尾巴 */
  .tail { position:absolute; right:-26px; bottom:2px; width:18px; height:60px;
    border-right:8px solid #f6a84c; border-radius:50%; transform:rotate(-18deg);
    transform-origin:bottom left; transition:transform .3s; }
  .cat.wiggle .tail { transform:rotate(30deg); }

  /* 爪 */
  .paw { position:absolute; bottom:-4px; width:16px; height:12px; background:#f6a84c; border-radius:50%; }
  .paw.l { left:16px; } .paw.r { right:16px; }

  /* 气泡（互动反馈） */
  .bubble { position:absolute; top:-40px; left:50%; transform:translateX(-50%);
    background:#fff; border-radius:16px; padding:6px 12px; font-size:14px; color:#b4552e; font-weight:700;
    box-shadow:0 3px 10px rgba(0,0,0,.12); opacity:0; transition:opacity .2s; white-space:nowrap; z-index:5; }
  .bubble.show { opacity:1; }
  .bubble::after { content:''; position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:8px solid #fff; }

  /* ===== 状态条 ===== */
  .stats { display:flex; flex-direction:column; gap:10px; margin:16px 0; }
  .stat { display:flex; align-items:center; gap:10px; }
  .stat .icon { width:32px; font-size:20px; text-align:center; }
  .stat .label { width:58px; font-size:13px; font-weight:700; color:#b4552e; }
  .bar { flex:1; height:14px; background:#f0e2d2; border-radius:8px; overflow:hidden; }
  .bar .fill { height:100%; width:50%; border-radius:8px; transition:width .4s ease, background .4s ease; }
  .stat.hunger .fill { background:linear-gradient(90deg,#ffb84d,#ff9f2e); }
  .stat.clean .fill  { background:linear-gradient(90deg,#7ed1f0,#4aa8e0); }
  .stat.mood .fill   { background:linear-gradient(90deg,#ffb3c6,#ff7aa2); }

  /* ===== 互动按钮 ===== */
  .actions { display:flex; gap:10px; margin-bottom:18px; }
  .act { flex:1; padding:12px 4px; border:none; border-radius:14px; cursor:pointer;
    font-size:14px; font-weight:700; color:#fff; transition:transform .12s, box-shadow .12s; }
  .act:active { transform:scale(.93); }
  .act.feed { background:linear-gradient(135deg,#ffb84d,#ff9f2e); box-shadow:0 4px 0 #e08a1e; }
  .act.clean{ background:linear-gradient(135deg,#7ed1f0,#4aa8e0); box-shadow:0 4px 0 #3a8ab8; }
  .act.pet  { background:linear-gradient(135deg,#ffb3c6,#ff7aa2); box-shadow:0 4px 0 #e05f88; }
  .act.play { background:linear-gradient(135deg,#c3a1ff,#9d7bff); box-shadow:0 4px 0 #8060d6; }
  .act .emoji { display:block; font-size:22px; margin-bottom:4px; }

  /* ===== 留言板 ===== */
  .board { border-top:2px dashed #e8d2bd; padding-top:14px; }
  .board h3 { font-size:14px; color:#b4552e; margin-bottom:10px; text-align:center; }
  .board-input { display:flex; gap:8px; margin-bottom:12px; }
  .board-input input { flex:1; padding:10px 12px; border:2px solid #f0e2d2; border-radius:12px; font-size:14px; outline:none; }
  .board-input input:focus { border-color:#ff9f2e; }
  .board-input button { padding:10px 16px; border:none; border-radius:12px; background:#ff9f2e; color:#fff; font-weight:700; cursor:pointer; }
  .board-list { max-height:150px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .msg { background:#fff; border-radius:12px; padding:8px 12px; font-size:13px; color:#6b4a30; box-shadow:0 2px 6px rgba(0,0,0,.06); }
  .msg .meta { font-size:11px; color:#c98a6a; margin-bottom:2px; font-weight:700; }
</style>
</head>
<body>
<div class="app">
  <div class="title">🐱 小橘猫</div>
  <div class="subtitle">全村人一起养的猫 · 照顾它吧</div>

  <!-- 舞台 + 小猫 -->
  <div class="stage">
    <div class="sun"></div>
    <div class="cloud"></div>
    <div class="cat" id="cat">
      <div class="bubble" id="bubble">开心!</div>
      <div class="cat-head">
        <div class="ear in ear-in l"></div>
        <div class="ear in ear-in r"></div>
        <div class="ear l"></div>
        <div class="ear r"></div>
        <div class="blush l"></div>
        <div class="blush r"></div>
        <div class="whisker l1"></div><div class="whisker l2"></div>
        <div class="whisker r1"></div><div class="whisker r2"></div>
        <div class="eye-wrap l"><div class="eye"><div class="pupil"></div><div class="blink"></div></div></div>
        <div class="eye-wrap r"><div class="eye"><div class="pupil"></div><div class="blink"></div></div></div>
        <div class="sad-brows"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
      </div>
      <div class="cat-body belly"></div>
      <div class="tail"></div>
      <div class="paw l"></div>
      <div class="paw r"></div>
    </div>
    <div class="grass"></div>
  </div>

  <!-- 状态条 -->
  <div class="stats">
    <div class="stat hunger"><span class="icon">🍗</span><span class="label">饥饿值</span>
      <div class="bar"><div class="fill" id="hungerBar"></div></div><span class="val" id="hungerVal">100</span></div>
    <div class="stat clean"><span class="icon">🛁</span><span class="label">清洁值</span>
      <div class="bar"><div class="fill" id="cleanBar"></div></div><span class="val" id="cleanVal">100</span></div>
    <div class="stat mood"><span class="icon">💖</span><span class="label">心情值</span>
      <div class="bar"><div class="fill" id="moodBar"></div></div><span class="val" id="moodVal">100</span></div>
  </div>

  <!-- 互动按钮 -->
  <div class="actions">
    <button class="act feed" data-act="feed"><span class="emoji">🍗</span>喂食</button>
    <button class="act clean" data-act="clean"><span class="emoji">🛁</span>洗澡</button>
    <button class="act pet" data-act="pet"><span class="emoji">🤚</span>摸摸</button>
    <button class="act play" data-act="play"><span class="emoji">🎾</span>玩耍</button>
  </div>

  <!-- 留言板 -->
  <div class="board">
    <h3>💬 留言板</h3>
    <div class="board-input">
      <input id="msgInput" placeholder="说点什么…" maxlength="60">
      <button id="msgSend">发送</button>
    </div>
    <div class="board-list" id="msgList"></div>
  </div>
</div>

<script>
// ============ 状态系统 ============
const state = {
  hunger: 100, // 饥饿值（越大越饱）
  clean: 100,  // 清洁值
  mood: 100,   // 心情值
};

// 互动效果定义
const ACTIONS = {
  feed:  { hunger:+20, clean:-4, mood:+8,  bubble:'好吃! 😋', anim:'bounce', sound:'开心!' },
  clean: { hunger:0,   clean:+30,mood:+5,  bubble:'香香哒 ✨', anim:'flash',  sound:'干净了!' },
  pet:   { hunger:0,   clean:0,  mood:+12, bubble:'呼噜呼噜~ 😊', anim:'wiggle', sound:'真乖!' },
  play:  { hunger:-8,  clean:-10,mood:+15, bubble:'玩起来啦! 🎉', anim:'bounce', sound:'好开心!' },
};

// 自然衰减（模拟真实时间流逝）：每 5 秒扣一点
function decay() {
  state.hunger = Math.max(0, state.hunger - 1.2);
  state.clean  = Math.max(0, state.clean - 0.6);
  state.mood   = Math.max(0, state.mood - 0.8);
  updateUI();
}
setInterval(decay, 5000);

// ============ 表情反馈 ============
function updateExpression() {
  const cat = document.getElementById('cat');
  // 清除旧表情类
  cat.classList.remove('happy','sad','tired','sleep');
  document.querySelector('.sad-brows').innerHTML =
    '<div class="brow sad-brow l"></div><div class="brow sad-brow r"></div>';

  if (state.hunger < 20 || state.clean < 20 || state.mood < 20) {
    cat.classList.add('sad');
  } else if (state.mood >= 80) {
    cat.classList.add('happy');
  } else if (state.hunger < 40) {
    cat.classList.add('tired');
  }
}

// 眨眼动画
setInterval(() => {
  document.querySelectorAll('.blink').forEach(b => {
    b.style.display = 'block';
    setTimeout(() => b.style.display = 'none', 120);
  });
}, 3500);

// ============ UI 更新 ============
function updateUI() {
  const set = (bar, val, el) => {
    const v = Math.round(Math.max(0, Math.min(100, val)));
    bar.style.width = v + '%';
    el.textContent = v;
    // 低值时变色提醒
    bar.parentElement.querySelector('.fill').style.filter = v < 25 ? 'saturate(1.6)' : 'saturate(1)';
  };
  set(document.getElementById('hungerBar'), state.hunger, document.getElementById('hungerVal'));
  set(document.getElementById('cleanBar'), state.clean, document.getElementById('cleanVal'));
  set(document.getElementById('moodBar'), state.mood, document.getElementById('moodVal'));
  updateExpression();
}

// 气泡提示
let bubbleTimer;
function showBubble(text) {
  const b = document.getElementById('bubble');
  b.textContent = text;
  b.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => b.classList.remove('show'), 1500);
}

// ============ 互动逻辑 ============
function doAction(name) {
  const a = ACTIONS[name];
  if (!a) return;
  const cat = document.getElementById('cat');
  // 动画
  cat.classList.remove('wiggle','bounce','flash');
  void cat.offsetWidth; // 重触发动画
  cat.classList.add(a.anim);
  setTimeout(() => cat.classList.remove(a.anim), 600);
  // 状态变化
  state.hunger = Math.max(0, Math.min(100, state.hunger + a.hunger));
  state.clean  = Math.max(0, Math.min(100, state.clean + a.clean));
  state.mood   = Math.max(0, Math.min(100, state.mood + a.mood));
  // 反馈
  showBubble(a.bubble);
  updateUI();
  // 存本地（模拟）
  saveLocal();
}

document.querySelectorAll('.act').forEach(btn => {
  btn.addEventListener('click', () => {
    doAction(btn.dataset.act);
    // 点击小猫也开心
    document.getElementById('cat').classList.add('bounce');
    setTimeout(()=>document.getElementById('cat').classList.remove('bounce'),500);
  });
});

// 摸摸小猫本体也能有反馈
document.getElementById('cat').addEventListener('click', () => doAction('pet'));

// ============ 本地持久化（模拟多人同步前的单机存档） ============
function saveLocal() {
  localStorage.setItem('cat-state', JSON.stringify(state));
}
function loadLocal() {
  try {
    const s = JSON.parse(localStorage.getItem('cat-state'));
    if (s) Object.assign(state, s);
  } catch(e) {}
}
loadLocal();
updateUI();

// ============ 留言板（本地模拟） ============
const messages = JSON.parse(localStorage.getItem('cat-msgs') || '["大家好！我们一起养小橘猫吧 🐱"]');
function renderMsgs() {
  const list = document.getElementById('msgList');
  list.innerHTML = messages.map((m, i) =>
    `<div class="msg"><div class="meta">🐈 网友${i+1} · 刚刚</div>${escapeHtml(m)}</div>`
  ).join('');
  list.scrollTop = list.scrollHeight;
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
document.getElementById('msgSend').addEventListener('click', () => {
  const inp = document.getElementById('msgInput');
  const v = inp.value.trim();
  if (v) { messages.push(v); localStorage.setItem('cat-msgs', JSON.stringify(messages)); renderMsgs(); inp.value=''; }
});
document.getElementById('msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('msgSend').click();
});
renderMsgs();

updateExpression();
</script>
</body>
</html>
