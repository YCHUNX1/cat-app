<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>羊毛 · 像素云养猫</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ background:#2d2a3e; }
  body {
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',monospace;
    background:linear-gradient(180deg,#3a3a50 0%,#2d2a3e 100%);
    min-height:100vh; height:100vh; overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
    color:#e8e4f0;
  }
  .topbar { width:100%; text-align:center; padding:14px 0 4px; }
  .topbar h1 { font-size:22px; font-weight:800; letter-spacing:3px; color:#ffd94d; text-shadow:3px 3px 0 #1a1a2e; }
  .topbar p { font-size:12px; color:#a99ec4; margin-top:2px; }

  /* 像素舞台 */
  #stage {
    flex:1; width:100%; max-width:480px; position:relative; cursor:pointer;
    image-rendering:pixelated; image-rendering:crisp-edges;
  }
  #stage canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; width:100%; height:100%; }

  .hint {
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.55); color:#ffd94d; font-size:12px;
    padding:4px 14px; border-radius:6px; font-weight:700;
    pointer-events:none; animation:fadehint 7s ease forwards; white-space:nowrap; z-index:5;
    border:2px solid #000; box-shadow:0 0 0 2px #ffd94d33;
  }
  @keyframes fadehint { 0%{opacity:0;} 10%{opacity:1;} 80%{opacity:1} 100%{opacity:0} }

  /* 健康度 */
  #health {
    position:absolute; top:8px; right:12px; z-index:5;
    background:#1a1a2e; border:2px solid #000; padding:4px 12px; font-size:13px; font-weight:800;
    box-shadow:3px 3px 0 rgba(0,0,0,.4); display:flex;align-items:center;gap:6px;
  }
  .health-good{color:#6fe88a} .health-ok{color:#ffd94d} .health-bad{color:#ff6b6b}

  /* 气泡 */
  #bubble {
    position:absolute; top:6%; left:50%; transform:translateX(-50%);
    background:#fff; color:#e14d4d; font-weight:800; font-size:14px;
    border:3px solid #1a1a2e; padding:6px 14px; box-shadow:4px 4px 0 rgba(0,0,0,.35);
    opacity:0; transition:opacity .2s; z-index:10; pointer-events:none; white-space:nowrap;
  }
  #bubble.show { opacity:1; animation:pop .25s steps(2,end); }
  @keyframes pop { 0%{transform:translateX(-50%) scale(.5)} 100%{transform:translateX(-50%) scale(1)} }
  #bubble::after{ content:''; position:absolute; bottom:-10px; left:50%; transform:translateX(-50%); width:0;height:0; border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid #1a1a2e; }

  /* 面板 */
  .panel {
    width:100%; max-width:480px; padding:14px 16px 10px;
    background:#1a1a2e; border-top:4px solid #000;
    box-shadow:0 -8px 0 rgba(0,0,0,.35); position:relative; z-index:2;
  }

  /* 状态条（像素风） */
  .stats { display:flex; gap:10px; }
  .stat { flex:1; text-align:center; }
  .stat .ic { font-size:18px; display:block; margin-bottom:2px; }
  .stat .lab { font-size:10px; font-weight:700; color:#a99ec4; margin-bottom:3px; }
  .bar { height:12px; background:#0f0f1a; border:2px solid #000; position:relative; }
  .bar i { display:block; height:100%; transition:width .5s steps(8); box-shadow:inset 0 -3px 0 rgba(0,0,0,.3); }
  .stat:nth-child(1) .bar i{background:repeating-linear-gradient(90deg,#ff9f3c,#ff9f3c 8px,#e0822a 8px,#e0822a 10px);}
  .stat:nth-child(2) .bar i{background:repeating-linear-gradient(90deg,#4fb3e8,#4fb3e8 8px,#3a8ab8 8px,#3a8ab8 10px);}
  .stat:nth-child(3) .bar i{background:repeating-linear-gradient(90deg,#ff6f92,#ff6f92 8px,#e05278 8px,#e05278 10px);}
  .stat .val { font-size:11px; font-weight:800; color:#e8e4f0; margin-top:2px; }

  /* 按钮（像素风） */
  .actions { display:flex; gap:8px; padding:12px 0 10px; }
  .act { flex:1; padding:11px 2px 9px; border:none; cursor:pointer; font-weight:800; color:#fff; font-size:13px; position:relative; transition:transform .06s; font-family:inherit; }
  .act .em { display:block; font-size:20px; margin-bottom:2px; }
  .act:active{ transform:translate(2px,2px); box-shadow:none !important; }
  .act.feed{ background:#ff9f3c; box-shadow:4px 4px 0 #1a1a2e, -2px -2px 0 #000; color:#3a2400; }
  .act.clean{background:#4fb3e8; box-shadow:4px 4px 0 #1a1a2e, -2px -2px 0 #000; color:#00263a; }
  .act.pet { background:#ff6f92; box-shadow:4px 4px 0 #1a1a2e, -2px -2px 0 #000; color:#3a0024; }
  .act.play{ background:#a884ff; box-shadow:4px 4px 0 #1a1a2e, -2px -2px 0 #000; color:#1e003a; }

  /* 留言板 */
  .board { border-top:2px dashed #393057; padding-top:10px; padding-bottom:2px; }
  .board-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .board-head b { font-size:13px; color:#ffd94d; }
  .board-head .tag { font-size:10px; color:#a99ec4; background:#232038; padding:2px 8px; }
  .board-list { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .board-list::-webkit-scrollbar{ display:none; }
  .msg { flex:0 0 auto; max-width:180px; background:#232038; border:2px solid #000; padding:7px 10px; font-size:11px; color:#cfc8e0; box-shadow:3px 3px 0 rgba(0,0,0,.4); }
  .msg .m { font-size:10px; color:#ffd94d; font-weight:800; margin-bottom:3px; }
  .board-input { display:flex; gap:8px; margin-top:10px; }
  .board-input input { flex:1; padding:10px 12px; border:2px solid #000; font-size:13px; outline:none; background:#0f0f1a; color:#e8e4f0; font-family:inherit; }
  .board-input button { padding:10px 18px; border:none; background:#ffd94d; color:#1a1a2e; font-weight:800; cursor:pointer; border:2px solid #000; font-family:inherit; }
  .board-input button:active{ transform:translate(2px,2px); }
  #need-tip{ text-align:center; font-size:11px; font-weight:700; color:#ff6b6b; min-height:16px; opacity:0; transition:opacity .3s; }
  #need-tip.show{opacity:1;}

  /* AI 聊天输入框 */
  .chatbox { position:relative; z-index:3; width:100%; max-width:480px; display:flex; gap:8px; padding:6px 16px; }
  .chatbox input { flex:1; padding:10px 14px; border:2px solid #000; font-size:13px; outline:none; background:#0f0f1a; color:#e8e4f0; font-family:inherit; }
  .chatbox button { padding:10px 16px; border:none; background:#ffd94d; color:#1a1a2e; font-weight:800; cursor:pointer; border:2px solid #000; font-family:inherit; }
  .chatbox button:active{ transform:translate(2px,2px); }
  #chatStatus { display:none; position:absolute; right:16px; bottom:-14px; font-size:10px; color:#7fd0f0; }
</style>
</head>
<body>

  <div class="topbar">
    <h1>🐱 羊毛</h1>
    <p>像素云养宠 · 点它摸一摸 · 各种动作都有</p>
  </div>

  <div class="chatbox">
    <input id="chatInput" maxlength="60" placeholder="跟羊毛说点什么…（AI 对话）">
    <button id="chatSend">▶</button>
    <span id="chatStatus"></span>
  </div>

  <div id="stage">
    <div class="hint">✋ 点一下它试试，多点点有惊喜</div>
    <div id="need-tip"></div>
    <div id="health">💚 状态良好</div>
    <div id="bubble">喵~</div>
  </div>

  <div class="panel">
    <div class="stats">
      <div class="stat"><span class="ic">🍗</span><div class="lab">饥饿</div><div class="bar"><i id="hBar"></i></div><div class="val"><span id="hVal">100</span>%</div></div>
      <div class="stat"><span class="ic">🛁</span><div class="lab">清洁</div><div class="bar"><i id="cBar"></i></div><div class="val"><span id="cVal">100</span>%</div></div>
      <div class="stat"><span class="ic">💖</span><div class="lab">心情</div><div class="bar"><i id="mBar"></i></div><div class="val"><span id="mVal">100</span>%</div></div>
    </div>

    <div class="actions">
      <button class="act feed" data-act="feed"><span class="em">🍗</span>喂食</button>
      <button class="act clean" data-act="clean"><span class="em">🛁</span>洗澡</button>
      <button class="act pet" data-act="pet"><span class="em">🤚</span>摸摸</button>
      <button class="act play" data-act="play"><span class="em">🎾</span>玩耍</button>
    </div>

    <div class="board">
      <div class="board-head"><b>💬 留言板</b><span class="tag">暂为本地</span></div>
      <div class="board-list" id="msgList"></div>
      <div class="board-input">
        <input id="msgInput" maxlength="40" placeholder="说点什么…">
        <button id="msgSend">发送</button>
      </div>
    </div>
  </div>

  <script src="./aikey.js?v=11"></script>
  <script src="./pixcat.js?v=11"></script>
  <script src="./pixapp.js?v=11"></script>
</body>
</html>
