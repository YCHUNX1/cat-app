<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小狐狸 · 云养宠</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:linear-gradient(180deg, #ffeef0 0%, #ffe0e2 30%, #ffd0d6 60%, #ffc2cb 100%);
    min-height:100vh; height:100vh; overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
    color:#7a3b3b;
  }

  /* 漂浮装饰 */
  .deco { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .deco span { position:absolute; bottom:-40px; font-size:22px; opacity:.35; animation:floatup linear infinite; }
  @keyframes floatup { 0%{ transform:translateY(0) rotate(0); opacity:0;} 12%{opacity:.4;} 100%{ transform:translateY(-110vh) rotate(360deg); opacity:0;} }

  .topbar { position:relative; z-index:2; width:100%; text-align:center; padding:16px 0 6px; }
  .topbar h1 { font-size:22px; font-weight:800; letter-spacing:3px; color:#b94f4f; text-shadow:0 2px 0 rgba(255,255,255,.7); }
  .topbar p { font-size:12px; color:#cf7f7f; margin-top:3px; }
  .topbar .heart { display:inline-block; animation:beat 1.4s ease-in-out infinite; }
  @keyframes beat { 0%,100%{transform:scale(1)} 25%{transform:scale(1.15)} 40%{transform:scale(1)} 60%{transform:scale(1.12)} }

  /* 3D 舞台 */
  #stage { position:relative; z-index:1; flex:1; width:100%; max-width:560px; cursor:grab; }
  #stage.dragging { cursor:grabbing; }
  #stage canvas { display:block; }

  .hint {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,.8); color:#b05a5a; font-size:12px;
    padding:5px 16px; border-radius:20px; font-weight:700; box-shadow:0 2px 10px rgba(0,0,0,.08);
    pointer-events:none; animation:fadehint 7s ease forwards; white-space:nowrap; z-index:5;
  }
  @keyframes fadehint { 0%{opacity:0;transform:translateX(-50%) translateY(4px)} 10%{opacity:1;transform:translateX(-50%) translateY(0)} 80%{opacity:1} 100%{opacity:0} }

  /* 健康度徽章 */
  #health {
    position:absolute; top:12px; right:14px; z-index:5;
    background:rgba(255,255,255,.9); border-radius:20px; padding:4px 14px;
    font-size:13px; font-weight:800; box-shadow:0 2px 10px rgba(0,0,0,.1);
    display:flex; align-items:center; gap:6px;
  }
  .health-good{color:#3a8a4a} .health-ok{color:#b0882e} .health-bad{color:#c05050}

  /* 气泡 */
  #bubble {
    position:absolute; top:6%; left:50%; transform:translateX(-50%);
    background:#fff; border-radius:20px; padding:9px 18px; font-size:15px; font-weight:800;
    color:#d14545; box-shadow:0 6px 20px rgba(200,80,80,.3);
    opacity:0; transition:opacity .25s; z-index:10; pointer-events:none; white-space:nowrap;
  }
  #bubble.show { opacity:1; animation:pop .3s ease; }
  @keyframes pop { 0%{transform:translateX(-50%) scale(.6);opacity:0} 60%{transform:translateX(-50%) scale(1.12);opacity:1} 100%{transform:translateX(-50%) scale(1)} }
  #bubble::after{ content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); width:0;height:0; border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid #fff; }

  /* 底部面板 */
  .panel {
    position:relative; z-index:2; width:100%; max-width:560px; padding:16px 20px 12px;
    background:rgba(255,255,255,.88); backdrop-filter:blur(8px);
    border-radius:28px 28px 0 0; box-shadow:0 -8px 34px rgba(180,80,80,.18);
  }

  /* 状态条 */
  .stats { display:flex; gap:10px; }
  .stat { flex:1; text-align:center; }
  .stat .ic { font-size:20px; display:block; margin-bottom:2px; }
  .stat .lab { font-size:11px; font-weight:700; color:#b05a5a; margin-bottom:3px; }
  .bar { height:10px; background:#f3e2e2; border-radius:6px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.06); }
  .bar i { display:block; height:100%; border-radius:6px; transition:width .5s ease, background .4s; }
  .stat:nth-child(1) .bar i { background:linear-gradient(90deg,#ffc078,#ff9f3c); }
  .stat:nth-child(2) .bar i { background:linear-gradient(90deg,#9ee0f7,#4fb3e8); }
  .stat:nth-child(3) .bar i { background:linear-gradient(90deg,#ff9db4,#ff6f92); }
  .stat .val { font-size:12px; font-weight:800; margin-top:2px; color:#a14a4a; display:inline-block; min-width:20px; }

  /* 按钮 */
  .actions { display:flex; gap:10px; padding:14px 0 12px; }
  .act { flex:1; padding:12px 2px 10px; border:none; border-radius:18px; cursor:pointer; font-weight:800; color:#fff; font-size:13px; transition:transform .12s, filter .15s, box-shadow .12s; position:relative; overflow:hidden; }
  .act:hover { transform:translateY(-2px); filter:brightness(1.05); }
  .act:active { transform:scale(.93); }
  .act .em { display:block; font-size:22px; margin-bottom:2px; }
  .act.feed{ background:linear-gradient(135deg,#ffc078,#ff9f3c); box-shadow:0 5px 0 #e0822a; }
  .act.clean{background:linear-gradient(135deg,#9ee0f7,#4fb3e8); box-shadow:0 5px 0 #3596c8; }
  .act.pet { background:linear-gradient(135deg,#ff9db4,#ff6f92); box-shadow:0 5px 0 #e05278; }
  .act.play{ background:linear-gradient(135deg,#d0b0ff,#a884ff); box-shadow:0 5px 0 #8b66d6; }
  .act:active { box-shadow:0 1px 0 #00022; }

  /* 留言板 */
  .board { border-top:2px dashed #f3d8d8; padding-top:12px; padding-bottom:4px; }
  .board-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .board-head b { font-size:14px; color:#b05a5a; }
  .board-head .tag { font-size:10px; color:#cf7f7f; background:#fdeaea; padding:2px 8px; border-radius:10px; }
  .board-list { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .board-list::-webkit-scrollbar{ display:none; }
  .msg { flex:0 0 auto; max-width:190px; background:#fffaf5; border-radius:14px; padding:8px 11px; font-size:12px; color:#8a4b4b; box-shadow:0 2px 8px rgba(0,0,0,.05); border:1px solid #fae0e0; }
  .msg .m { font-size:10px; color:#c07373; font-weight:700; margin-bottom:3px; }
  .board-input { display:flex; gap:8px; margin-top:10px; }
  .board-input input { flex:1; padding:11px 14px; border:2px solid #f5dbdb; border-radius:16px; font-size:14px; outline:none; background:#fff; transition:border-color .2s; }
  .board-input input:focus{ border-color:#ff9f3c; }
  .board-input button { padding:11px 20px; border:none; border-radius:16px; background:linear-gradient(135deg,#ffc078,#ff9f3c); color:#fff; font-weight:800; cursor:pointer; box-shadow:0 3px 0 #e0822a; transition:transform .1s; }
  .board-input button:active{ transform:scale(.94); }

  /* 底部提示（需要照顾时的提醒） */
  #need-tip {
    text-align:center; font-size:12px; font-weight:700; color:#e05278;
    min-height:18px; margin-top:2px; opacity:0; transition:opacity .3s;
  }
  #need-tip.show{ opacity:1; }
</style>
</head>
<body>

  <div class="deco" id="deco"></div>

  <div class="topbar">
    <h1><span class="heart">🦊</span> 小狐狸</h1>
    <p>3D 云养宠 · 拖它转个圈 · 全村一起养</p>
  </div>

  <!-- 3D 舞台 -->
  <div id="stage">
    <div class="hint">✋ 按住拖动，转个角度看看它</div>
    <div id="need-tip"></div>
    <div id="health">💚 状态良好</div>
    <div id="bubble">开心!</div>
  </div>

  <!-- 状态 + 互动 + 留言 -->
  <div class="panel">
    <div class="stats">
      <div class="stat"><span class="ic">🍗</span><div class="lab">饥饿</div><div class="bar"><i id="hBar"></i></div><div class="val"><span id="hVal">100</span>%</div></div>
      <div class="stat"><span class="ic">🛁</span><div class="lab">清洁</div><div class="bar"><i id="cBar"></i></div><div class="val"><span id="cVal">100</span>%</div></div>
      <div class="stat"><span class="ic">💖</span><div class="lab">心情</div><div class="bar"><i id="mBar"></i></div><div class="val"><span id="mVal">100</span>%</div></div>
    </div>

    <div class="actions">
      <button class="act feed" data-act="feed"><span class="em">🍗</span>喂食</button>
      <button class="act clean" data-act="clean"><span class="em">🛁</span>洗澡</button>
      <button class="act pet" data-act="pet"><span class="em">🤚</span>摸摸</button>
      <button class="act play" data-act="play"><span class="em">🎾</span>玩耍</button>
    </div>

    <div class="board">
      <div class="board-head"><b>💬 留言板</b><span class="tag">暂为本地</span></div>
      <div class="board-list" id="msgList"></div>
      <div class="board-input">
        <input id="msgInput" maxlength="40" placeholder="说点什么…">
        <button id="msgSend">发送</button>
      </div>
    </div>
  </div>

  <script src="./lib/three/three.min.js?v=3"></script>
  <script src="./lib/three/GLTFLoader-umd.js?v=3"></script>
  <script src="./app3d.js?v=3"></script>
  <script src="./app.js?v=3"></script>
</body>
</html>
