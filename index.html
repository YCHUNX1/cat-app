<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小橘猫 · 3D 云养猫</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:radial-gradient(circle at 50% 30%, #ffe7ea, #ffd0d6 60%, #ffb9c4 100%);
    min-height:100vh; height:100vh; overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
    color:#7a3b3b;
  }
  .topbar { width:100%; text-align:center; padding:14px 0 4px; }
  .topbar h1 { font-size:20px; font-weight:800; letter-spacing:3px; color:#a14545; text-shadow:0 2px 0 rgba(255,255,255,.6); }
  .topbar p { font-size:11px; color:#c07373; margin-top:2px; }

  /* 3D 舞台 */
  #stage {
    flex:1; width:100%; max-width:520px; position:relative; cursor:grab;
  }
  #stage.dragging { cursor:grabbing; }
  #stage canvas { display:block; }

  .hint {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,.7); color:#b05a5a; font-size:12px;
    padding:4px 14px; border-radius:20px; font-weight:700;
    pointer-events:none; animation:fadehint 6s ease forwards; white-space:nowrap;
  }
  @keyframes fadehint { 0%{opacity:0;transform:translateX(-50%) translateY(4px)} 12%{opacity:1;transform:translateX(-50%) translateY(0)} 80%{opacity:1} 100%{opacity:0} }

  /* 气泡 */
  #bubble {
    position:absolute; top:8%; left:50%; transform:translateX(-50%);
    background:#fff; border-radius:18px; padding:8px 16px; font-size:15px; font-weight:800;
    color:#d14545; box-shadow:0 4px 16px rgba(200,60,60,.25);
    opacity:0; transition:opacity .25s; z-index:10; pointer-events:none; white-space:nowrap;
  }
  #bubble.show { opacity:1; animation:pop .3s ease; }
  @keyframes pop { 0%{transform:translateX(-50%) scale(.7)} 60%{transform:translateX(-50%) scale(1.08)} 100%{transform:translateX(-50%) scale(1)} }
  #bubble::after{ content:''; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%); width:0;height:0; border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #fff; }

  /* 状态条 */
  .panel {
    width:100%; max-width:520px; padding:14px 18px 8px; background:rgba(255,255,255,.85);
    border-radius:24px 24px 0 0; box-shadow:0 -6px 30px rgba(180,80,80,.15); backdrop-filter:blur(6px);
  }
  .stats { display:flex; gap:12px; }
  .stat { flex:1; text-align:center; }
  .stat .ic { font-size:20px; }
  .stat .lab { font-size:11px; font-weight:700; color:#b05a5a; margin-bottom:3px; }
  .bar { height:9px; background:#f3e0e0; border-radius:6px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:6px; transition:width .4s ease, background .4s; }
  .stat:nth-child(1) .bar i { background:linear-gradient(90deg,#ffb96b,#ff9f3c); }
  .stat:nth-child(2) .bar i { background:linear-gradient(90deg,#8fd8f5,#4fb3e8); }
  .stat:nth-child(3) .bar i { background:linear-gradient(90deg,#ff9db4,#ff6f92); }
  .stat .val { font-size:13px; font-weight:800; margin-top:2px; }

  /* 按钮 */
  .actions { display:flex; gap:10px; padding:14px 0 10px; }
  .act { flex:1; padding:11px 2px; border:none; border-radius:16px; cursor:pointer; font-weight:800; color:#fff; font-size:13px; transition:transform .12s, filter .15s; }
  .act:active { transform:scale(.92); }
  .act .em { display:block; font-size:20px; margin-bottom:2px; }
  .act.feed{ background:linear-gradient(135deg,#ffb96b,#ff9f3c); box-shadow:0 4px 0 #e0822a; }
  .act.clean{background:linear-gradient(135deg,#8fd8f5,#4fb3e8); box-shadow:0 4px 0 #3596c8; }
  .act.pet { background:linear-gradient(135deg,#ff9db4,#ff6f92); box-shadow:0 4px 0 #e05278; }
  .act.play{ background:linear-gradient(135deg,#c9a6ff,#a884ff); box-shadow:0 4px 0 #8b66d6; }

  /* 留言板 */
  .board { border-top:2px dashed #f0d3d3; padding-top:10px; padding-bottom:6px; }
  .board-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .board-head b { font-size:13px; color:#b05a5a; }
  .board-list { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .board-list::-webkit-scrollbar{ display:none; }
  .msg { flex:0 0 auto; max-width:180px; background:#fff; border-radius:14px; padding:8px 10px; font-size:12px; color:#8a4b4b; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .msg .m { font-size:11px; color:#c07373; font-weight:700; margin-bottom:2px; }
  .board-input { display:flex; gap:8px; margin-top:8px; }
  .board-input input { flex:1; padding:10px 12px; border:2px solid #f0d3d3; border-radius:14px; font-size:14px; outline:none; }
  .board-input input:focus{ border-color:#ff9f3c; }
  .board-input button { padding:10px 18px; border:none; border-radius:14px; background:#ff9f3c; color:#fff; font-weight:800; cursor:pointer; }
</style>
</head>
<body>

  <div class="topbar">
    <h1>🐱 小橘猫</h1>
    <p>3D 版 · 拖动视角看它 · 全村人一起养</p>
  </div>

  <!-- 3D 舞台 -->
  <div id="stage">
    <div class="hint">✋ 按住拖动，转个角度看看它</div>
    <div id="bubble">开心!</div>
  </div>

  <!-- 状态 + 互动 + 留言 -->
  <div class="panel">
    <div class="stats">
      <div class="stat"><div class="ic">🍗</div><div class="lab">饥饿</div><div class="bar"><i id="hBar"></i></div><div class="val" id="hVal">100</div></div>
      <div class="stat"><div class="ic">🛁</div><div class="lab">清洁</div><div class="bar"><i id="cBar"></i></div><div class="val" id="cVal">100</div></div>
      <div class="stat"><div class="ic">💖</div><div class="lab">心情</div><div class="bar"><i id="mBar"></i></div><div class="val" id="mVal">100</div></div>
    </div>

    <div class="actions">
      <button class="act feed" data-act="feed"><span class="em">🍗</span>喂食</button>
      <button class="act clean" data-act="clean"><span class="em">🛁</span>洗澡</button>
      <button class="act pet" data-act="pet"><span class="em">🤚</span>摸摸</button>
      <button class="act play" data-act="play"><span class="em">🎾</span>玩耍</button>
    </div>

    <div class="board">
      <div class="board-head"><b>💬 留言板</b><span style="font-size:11px;color:#c07373">（暂为本地，接后端后共享）</span></div>
      <div class="board-list" id="msgList"></div>
      <div class="board-input">
        <input id="msgInput" maxlength="40" placeholder="说点什么…">
        <button id="msgSend">发送</button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
  <script type="module" src="./app3d.js"></script>
</body>
</html>
